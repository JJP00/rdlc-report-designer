name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installers (NSIS + MSI + portable + zip)
    # Solo el propietario (JJP00) puede disparar el release: workflow_dispatch
    # (crea el tag `v<versión>` desde apps/back/package.json) o push de un tag
    # `v*` (se verifica que coincide con la versión). Otro actor = skipped.
    if: github.triggering_actor == 'JJP00'
    # Environment `release`: de aquí salen los secretos de firma (CSC_LINK /
    # CSC_KEY_PASSWORD) y aplican sus reglas de protección (aprobación, tags).
    environment: release
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Firma (opcional): define los secretos CSC_LINK (ruta/base64 del .pfx)
      # y CSC_KEY_PASSWORD y electron-builder firmará el ejecutable.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # La versión la manda `apps/back/package.json`:
      # - `workflow_dispatch`: se crea el tag `v<versión>` si no existe (apuntando
      #   a este commit) y la release se publica sobre él.
      # - push de tag: se verifica que el tag sea exactamente `v<versión>`.
      - name: Resolve version and tag
        id: release-meta
        shell: bash
        run: |
          version="$(node -p "require('./apps/back/package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión de la app (apps/back/package.json = $version). Sube la versión antes de taggear."
              exit 1
            fi
            echo "Tag $GITHUB_REF_NAME == apps/back/package.json ($version)"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force --quiet origin "+refs/tags/$tag:refs/tags/$tag"
            existing="$(git rev-parse "$tag^{commit}")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::El tag $tag ya existe apuntando a $existing (distinto de $GITHUB_SHA). Sube la versión en apps/back/package.json o borra el tag."
              exit 1
            fi
            echo "El tag $tag ya existe y apunta a este commit"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "Tag $tag creado sobre $GITHUB_SHA (versión $version)"
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm --filter @rdlc-designer/back dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/back/release/*.exe
            apps/back/release/*.msi
            apps/back/release/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          # Cabecera propia; GitHub antepone las notas automáticas ("What's Changed").
          body: |
            ## RDLC Report Designer v${{ steps.release-meta.outputs.version }}

            Instaladores para Windows:

            | Fichero | Uso |
            | --- | --- |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}-setup.exe` | Instalador clásico (NSIS) |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}.msi` | Despliegue corporativo |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}-portable.exe` | Sin instalación |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}-win-unpacked.zip` | Carpeta lista para ejecutar |

            > Sin certificado de firma, Windows puede mostrar el aviso de SmartScreen.
          generate_release_notes: true
          files: |
            apps/back/release/*.exe
            apps/back/release/*.msi
            apps/back/release/*.zip
