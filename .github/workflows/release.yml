name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installers (NSIS + MSI + portable + zip)

    if: >-
      github.triggering_actor == 'JJP00' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
   
    environment: release
    permissions:
      contents: write 
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version and tag
        id: release-meta
        shell: bash
        run: |
          version="$(node -p "require('./apps/back/package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión de la app (apps/back/package.json = $version). Sube la versión antes de taggear."
              exit 1
            fi
            echo "Tag $GITHUB_REF_NAME == apps/back/package.json ($version)"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force --quiet origin "+refs/tags/$tag:refs/tags/$tag"
            existing="$(git rev-parse "$tag^{commit}")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::El tag $tag ya existe apuntando a $existing (distinto de $GITHUB_SHA). Sube la versión en apps/back/package.json o borra el tag."
              exit 1
            fi
            echo "El tag $tag ya existe y apunta a este commit"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "Tag $tag creado sobre $GITHUB_SHA (versión $version)"
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build installers
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm --filter @rdlc-designer/back dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/back/release/*.exe
            apps/back/release/*.msi
            apps/back/release/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          body: |
            ## RDLC Report Designer v${{ steps.release-meta.outputs.version }}

            Instaladores para Windows:

            | Fichero | Uso |
            | --- | --- |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}-setup.exe` | Instalador clásico (NSIS) |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}.msi` | Despliegue corporativo |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}-portable.exe` | Sin instalación |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}-win-unpacked.zip` | Carpeta lista para ejecutar |

            > Sin certificado de firma, Windows puede mostrar el aviso de SmartScreen.
          generate_release_notes: true
          files: |
            apps/back/release/*.exe
            apps/back/release/*.msi
            apps/back/release/*.zip

  npm:
    name: npm publish (@rdlc-designer/mcp)
    needs: windows
    if: >-
      github.triggering_actor == 'JJP00' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false 

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check npm version
        id: npm-meta
        run: |
          version="$(node -p "require('./packages/rdlc-mcp/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -fsS -o /dev/null "https://registry.npmjs.org/@rdlc-designer%2Fmcp/$version"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@rdlc-designer/mcp@$version ya está en npm; se omite el publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.npm-meta.outputs.published == 'false'
        run: pnpm --filter @rdlc-designer/mcp build

      - name: Smoke test
        if: steps.npm-meta.outputs.published == 'false'
        run: pnpm --filter @rdlc-designer/mcp smoke

      # Sin `--provenance`: npm solo lo soporta desde repos públicos (privado = 422).
      - name: Publish to npm
        if: steps.npm-meta.outputs.published == 'false'
        working-directory: packages/rdlc-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

# ---------------------------------------------------------------------------
# Configuración del repositorio que complementa este workflow (no se puede
# hacer desde el YAML):
#
# 1. Settings → Environments → release
#    - Required reviewers: solo JJP00.
#    - Deployment branches and tags: "Selected branches and tags" → main y v*.
#    - Environment secrets: CSC_LINK, CSC_KEY_PASSWORD, NPM_TOKEN.
#    - Borrar esos mismos secretos del nivel de repositorio.
# 2. Ruleset sobre main: exigir PR + "Require review from Code Owners", con un
#    .github/CODEOWNERS que contenga:  /.github/workflows/ @JJP00
# 3. Ruleset de tags v*: restringir creación/borrado a JJP00. Ojo: el job
#    `windows` hace `git push origin "$tag"` con GITHUB_TOKEN y un ruleset de
#    tags podría bloquearlo; pruébalo con un tag de prueba.
# 4. Settings → Actions → General: limitar las actions permitidas.
# ---------------------------------------------------------------------------