name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installers (NSIS + MSI + portable + zip)

    if: >-
      github.triggering_actor == 'JJP00' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
   
    environment: release
    permissions:
      contents: write 
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version and tag
        id: release-meta
        shell: bash
        run: |
          version="$(node -p "require('./apps/back/package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Este workflow debe ejecutarse sobre el tag $tag (versión de apps/back/package.json = $version). Crea y sube el tag antes de lanzarlo."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME == apps/back/package.json ($version)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build installers
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm --filter @rdlc-designer/back dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/back/release/*.exe
            apps/back/release/*.msi
            apps/back/release/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          body: |
            ## RDLC Report Designer v${{ steps.release-meta.outputs.version }}

            Instaladores para Windows:

            | Fichero | Uso |
            | --- | --- |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}-setup.exe` | Instalador clásico (NSIS) |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}.msi` | Despliegue corporativo |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}-portable.exe` | Sin instalación |
            | `RDLC-Report-Designer-${{ steps.release-meta.outputs.version }}-win-unpacked.zip` | Carpeta lista para ejecutar |

            > Sin certificado de firma, Windows puede mostrar el aviso de SmartScreen.
          generate_release_notes: true
          files: |
            apps/back/release/*.exe
            apps/back/release/*.msi
            apps/back/release/*.zip

  npm:
    name: npm publish (@jjp00/rdlc-designer-mcp)
    needs: windows
    if: >-
      github.triggering_actor == 'JJP00' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) de npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false 

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: npm >= 11.5.1 (lo exige trusted publishing)
        run: npm install -g npm@latest

      - name: Check npm version
        id: npm-meta
        run: |
          version="$(node -p "require('./packages/rdlc-mcp/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -fsS -o /dev/null "https://registry.npmjs.org/@jjp00%2Frdlc-designer-mcp/$version"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@jjp00/rdlc-designer-mcp@$version ya está en npm; se omite el publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.npm-meta.outputs.published == 'false'
        run: pnpm --filter @jjp00/rdlc-designer-mcp build

      - name: Smoke test
        if: steps.npm-meta.outputs.published == 'false'
        run: pnpm --filter @jjp00/rdlc-designer-mcp smoke

      # Trusted publishing (OIDC): sin NPM_TOKEN ni registry-url. Provenance no está
      # soportado desde repos privados (422), así que se desactiva explícitamente.
      - name: Publish to npm
        if: steps.npm-meta.outputs.published == 'false'
        working-directory: packages/rdlc-mcp
        run: npm publish --provenance

# ---------------------------------------------------------------------------
# Configuración del repositorio que complementa este workflow (no se puede
# hacer desde el YAML):
#
# 1. Settings → Environments → release
#    - Required reviewers: solo JJP00.
#    - Deployment branches and tags: "Selected branches and tags" → main y v*.
#    - Environment secrets: CSC_LINK, CSC_KEY_PASSWORD.
#      (NPM_TOKEN ya no se usa: el publish va por trusted publishing / OIDC.)
#    - Borrar esos mismos secretos del nivel de repositorio.
# 1b. npmjs.com → @jjp00/rdlc-designer-mcp → Settings → Trusted Publisher → GitHub Actions:
#    JJP00 / rdlc-report-designer / release.yml / environment: release / marcar "Allow npm publish".
#    Caduca a los 2 días sin una publicación correcta: configúralo justo antes del release
#    que vaya a publicar una versión nueva del MCP.
# 2. Ruleset sobre main: exigir PR + "Require review from Code Owners", con un
#    .github/CODEOWNERS que contenga:  /.github/workflows/ @JJP00
# 3. Ruleset de tags v*: restringir creación/borrado a JJP00. Ojo: el job
#    `windows` hace `git push origin "$tag"` con GITHUB_TOKEN y un ruleset de
#    tags podría bloquearlo; pruébalo con un tag de prueba.
# 4. Settings → Actions → General: limitar las actions permitidas.
# ---------------------------------------------------------------------------
