name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installers (NSIS + MSI + portable + zip)
    # Solo el propietario (JJP00) puede disparar el release: workflow_dispatch
    # o push de un tag `v*`. Cualquier otro actor deja el workflow en skipped.
    if: github.triggering_actor == 'JJP00'
    # Environment `release`: de aquí salen los secretos de firma (CSC_LINK /
    # CSC_KEY_PASSWORD) y aplican sus reglas de protección (aprobación, tags).
    environment: release
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Firma (opcional): define los secretos CSC_LINK (ruta/base64 del .pfx)
      # y CSC_KEY_PASSWORD y electron-builder firmará el ejecutable.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # El tag debe ser `v<version>` con la misma versión que la app: los nombres
      # de los artefactos salen de `apps/back/package.json`, no del tag.
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./apps/back/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::El tag v$tag no coincide con la versión de la app (apps/back/package.json = $pkg). Sube la versión antes de taggear."
            exit 1
          fi
          echo "Tag v$tag == apps/back/package.json ($pkg)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm --filter @rdlc-designer/back dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/back/release/*.exe
            apps/back/release/*.msi
            apps/back/release/*.zip
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/back/release/*.exe
            apps/back/release/*.msi
            apps/back/release/*.zip
