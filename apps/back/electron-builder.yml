# Empaquetado Windows (T1).
#
#   pnpm --filter @rdlc-designer/back dist:dir          # carpeta sin instalador (smoke test)
#   pnpm --filter @rdlc-designer/back dist              # NSIS + MSI + portable + zip en `release/`
#   pnpm --filter @rdlc-designer/back dist:portable     # solo el portable
#
# Firma: electron-builder firma si `CSC_LINK` (ruta/base64 del .pfx) y
# `CSC_KEY_PASSWORD` están en el entorno; sin certificado el instalador sale
# sin firmar (aviso de SmartScreen). Ver `docs/release/0001-empaquetado-windows.md`.
appId: com.rdlcdesigner.desktop
productName: RDLC Report Designer
copyright: Copyright © 2026 RDLC Report Designer

directories:
  output: release

# La app empaquetada solo necesita el build y sus dependencias de producción
# (electron-builder las incluye aparte; el renderer, Monaco incluido, ya va en
# `out/renderer`).
files:
  - out/**
  - package.json

# El XSD oficial se lee con `readFileSync` en runtime: viaja fuera del asar.
extraResources:
  - from: resources/rdl2016
    to: rdl2016

# Sin dependencias nativas: no hace falta recompilar.
npmRebuild: false
publish: null

# Asociación de ficheros: el instalador registra la app como programa para los
# informes `.rdlc`/`.rdl` (doble clic en el Explorador). Solo la registran NSIS
# (exige `perMachine: true`) y MSI; portable y zip no. En Windows 10/11 el SO
# puede pedir confirmación la primera vez si el usuario ya tenía un programa
# predeterminado para la extensión.
fileAssociations:
  - ext: rdlc
    name: RDLCReport
    description: RDLC Report
  - ext: rdl
    name: RDLReport
    description: RDL Report

win:
  target:
    - nsis
    - msi
    # Portable: un solo .exe sin instalación (se autoextrae en %TEMP%).
    - portable
    # Zip: comprime el contenido de `win-unpacked` (carpeta lista para ejecutar).
    - zip
  # `zip` no tiene sección de configuración propia (a diferencia de nsis/msi/
  # portable): hereda este artifactName, que los otros tres sobreescriben.
  artifactName: RDLC-Report-Designer-${version}-win-unpacked.${ext}
  # Icono placeholder (azul con hoja) en `build/icon.ico`: sustituible por el definitivo.
  icon: build/icon.ico

nsis:
  oneClick: false
  # Por máquina: NSIS solo registra las asociaciones de fichero (fileAssociations)
  # en este modo; además deja el registro y las rutas a nivel de sistema.
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: RDLC Report Designer
  # Instalador multi-idioma EN/ES (fase 1.5 de i18n); el nombre del producto no
  # cambia. El MSI de WiX es mono-idioma en electron-builder (no admite
  # `installerLanguages`): se queda como está.
  installerLanguages: [en_US, es_ES]
  multiLanguageInstaller: true
  artifactName: RDLC-Report-Designer-${version}-setup.${ext}

msi:
  artifactName: RDLC-Report-Designer-${version}.${ext}

portable:
  artifactName: RDLC-Report-Designer-${version}-portable.${ext}
